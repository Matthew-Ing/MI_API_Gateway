apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  gateway.yaml: |
    listen: ":8088"
    upstreams:
      users:
        url: "http://userservice:8081"
      orders:
        url: "http://orderservice:8082"
    routes:
      - path: "/users"
        upstream: users
      - path: "/orders"
        upstream: orders
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
stringData:
  JWT_SECRET: "change-me"
  ADMIN_JWT_SECRET: "change-me"
  ADMIN_PASSWORD: "change-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:local
          ports:
            - containerPort: 8088
          env:
            - name: REDIS_ADDR
              value: redis:6379
            - name: RATE_LIMIT_MAX
              value: "100"
            - name: SAMPLE_API_KEY
              value: demo-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: JWT_SECRET
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: ADMIN_JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8088