
services:

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  userservice:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CMD: userservice
    expose:
      - "8081"

  orderservice:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CMD: orderservice
    expose:
      - "8082"

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CMD: gateway
    ports:
      - "8089:8088"
    depends_on:
      - userservice
      - orderservice
      - redis
    environment:
      - JWT_SECRET=secret
      - REDIS_ADDR=redis:6379
