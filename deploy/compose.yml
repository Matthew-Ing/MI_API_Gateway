services:
  userservice:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CMD: userservice
    expose:
      - "8081"

  orderservice:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CMD: orderservice
    expose:
      - "8082"

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CMD: gateway
    ports:
      - "8089:8088"
    depends_on:
      - userservice
      - orderservice
    environment:
      - JWT_SECRET=secret